# Render Blueprint: New + → Blueprint → pick this repo. Must live at the repo root.
services:
  - type: web
    name: kirtan-sewa
    runtime: node
    rootDir: kirtan-sewa # the app lives in this folder
    plan: free
    region: singapore # closest to India
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false # you type it in the Render dashboard
      - key: DATABASE_URL
        sync: false # Postgres connection string from Neon (free) — keeps bookings safe
      # Cloudflare R2 for post photos / videos / music (optional — see README "Posts")
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Claude API key for the Punjabi wording on generated posters (optional)
      - key: ANTHROPIC_API_KEY
        sync: false
