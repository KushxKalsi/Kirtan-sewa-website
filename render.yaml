# Render Blueprint: New + → Blueprint → pick this repo. Must live at the repo root.
services:
  - type: web
    name: kirtan-sewa
    runtime: node
    rootDir: kirtan-sewa # the app lives in this folder
    plan: free
    region: singapore # closest to India
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false # you type it in the Render dashboard
      - key: DATABASE_URL
        sync: false # Postgres connection string from Neon (free) — keeps bookings safe
